<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <rect width="48" height="48" rx="12" fill="url(#shine)"/>
  <!-- keyboard body -->
  <rect x="8" y="20" width="32" height="18" rx="4" fill="none" stroke="white" stroke-width="1.8" opacity="0.9"/>
  <!-- keys row 1 -->
  <rect x="11" y="23" width="5" height="4" rx="1" fill="white" opacity="0.35"/>
  <rect x="17.5" y="23" width="5" height="4" rx="1" fill="white" opacity="0.55"/>
  <rect x="24" y="23" width="5" height="4" rx="1" fill="white" opacity="0.35"/>
  <rect x="30.5" y="23" width="5" height="4" rx="1" fill="white" opacity="0.35"/>
  <!-- spacebar -->
  <rect x="14" y="30" width="20" height="4" rx="1.5" fill="white" opacity="0.4"/>
  <!-- flow curves -->
  <path d="M8 18 Q16 8, 24 13 Q32 18, 40 10" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M10 21 Q18 14, 24 16" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- sparkle dots -->
  <circle cx="40" cy="10" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="8" cy="18" r="1" fill="white" opacity="0.5"/>
</svg>
